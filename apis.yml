aid: acv
name: ACV
description: 'ACV Auctions (NASDAQ: ACVA) operates the nation''s largest online wholesale marketplace and daily auto auction
  platform, connecting franchise and independent dealers to buy and sell used vehicles. Founded in 2014 and headquartered
  in Buffalo, New York, ACV pairs a mobile-first bidding app with third-party vehicle inspections and condition reports, real-time
  market data (ACV MAX and market insights), transportation logistics, and dealer floor-plan financing through ACV Capital.
  This is a company profile in the API Evangelist network; ACV does not publish a public developer API surface.'
